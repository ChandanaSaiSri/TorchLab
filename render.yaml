# Render Blueprint: creates the database, code runner and API in one go.
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill the two "sync: false" values when asked.
databases:
  - name: torchlab-db
    plan: free            # Render's free Postgres expires after 30 days; switch to a paid plan to keep data

services:
  - type: web
    name: torchlab-runner
    runtime: docker
    dockerfilePath: ./runner/Dockerfile
    dockerContext: ./runner
    plan: starter         # PyTorch needs more than the free 512 MB
    healthCheckPath: /info

  - type: web
    name: torchlab-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: torchlab-db, property: connectionString }
      - key: RUNNER_URL
        fromService: { type: web, name: torchlab-runner, property: hostport }
      - key: ADMIN_EMAILS
        sync: false       # your email
      - key: APP_URL
        sync: false       # your Vercel site URL, e.g. https://torchlab.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false       # optional, leave empty to hide AI help
