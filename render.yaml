# Render Blueprint (free tier): creates only the API. The database is Neon (free) and the code runner is a
# Hugging Face Space (free), see DEPLOY.md. Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: torchlab-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free            # sleeps after 15 min idle; the first request after that takes ~1 minute
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false       # Neon connection string
      - key: RUNNER_URL
        sync: false       # https://<user>-<space>.hf.space
      - key: RUNNER_TOKEN
        sync: false       # same secret you set on the Hugging Face Space
      - key: ADMIN_EMAILS
        sync: false       # your email
      - key: APP_URL
        sync: false       # your Vercel site URL
      - key: ANTHROPIC_API_KEY
        sync: false       # optional
