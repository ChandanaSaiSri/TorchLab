# Render Blueprint, all on the free plan (no card needed): the code runner and the API.
# The database is Neon (free) and the website is Vercel (free). See DEPLOY.md.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: torchlab-runner
    runtime: docker
    dockerfilePath: ./runner/Dockerfile
    dockerContext: ./runner
    plan: free            # 512 MB RAM: the settings below keep one program at a time under that
    healthCheckPath: /health
    envVars:
      - key: RUNNER_TOKEN
        generateValue: true
      - key: MAX_CONCURRENT
        value: "1"
      - key: MAX_PROGRAM_MB
        value: "380"      # a program using more private memory than this is stopped with a friendly message
      - key: OMP_THREADS
        value: "1"

  - type: web
    name: torchlab-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free            # sleeps after 15 min idle; the first request after that takes ~1 minute
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: RUNNER_TIMEOUT_MS
        value: "90000"    # the free runner also sleeps; allow time for it to wake on the first run
      - key: RUNNER_TOKEN
        fromService: { type: web, name: torchlab-runner, envVarKey: RUNNER_TOKEN }
      - key: RUNNER_URL
        sync: false       # https://torchlab-runner-xxxx.onrender.com (shown on the runner's page)
      - key: DATABASE_URL
        sync: false       # Neon connection string
      - key: ADMIN_EMAILS
        sync: false       # your email
      - key: APP_URL
        sync: false       # your Vercel site URL
      - key: ANTHROPIC_API_KEY
        sync: false       # optional
